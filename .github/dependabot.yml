# Weekly pull requests for outdated dependencies and GitHub Actions, and
# security fixes as soon as they're published. Minor and patch updates
# come grouped in one pull request; majors come one by one, since they
# can need code changes (CI checks each).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
