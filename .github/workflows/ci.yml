# Checks every pull request and every push to main: known advisories in
# the production dependencies, the types (the Edge Functions' with Deno),
# the lint (hooks, the app boundaries, storage), the unit tests, a
# production build with every app opened in a browser and measured
# against the performance budgets, and the database's rules against a
# real Postgres.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # For pull requests the previews workflow opens: one opened with a
  # job's token starts no workflows, so that job starts this one on its
  # branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Types, tests, build, apps and budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The same Node as Vercel: engines.node in package.json.
          node-version-file: package.json
          cache: npm
      - run: npm ci
      # Known high or critical advisories in what ships (dev tools excluded),
      # but for the exceptions scripts/audit.mjs lists, each with its reason
      # and a date to look again.
      - run: node scripts/audit.mjs
      - run: npm run check
      # The Edge Functions run on Deno, outside tsconfig.json, and Vitest
      # strips their types: Deno checks them as Supabase will run them.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/*/index.ts
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Only the headless shell, which is all the scripts launch. It's
      # cached by Playwright's version; the system libraries it needs are
      # installed every time.
      - name: Find Playwright's version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:smoke
      # Download budgets fail the build; script times are only reported here.
      - run: npm run perf

  database:
    name: Database rules
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # run.sh generates supabase/schema.sql (Node) and the database's
      # TypeScript types (the Supabase CLI, then oxfmt from npm ci) and
      # fails when the committed ones are out of date.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          # The types' wording changes between versions: keep this the
          # version SUPABASE_CLI in supabase/tests/run.sh names.
          version: 2.119.0
      - run: bash supabase/tests/run.sh
