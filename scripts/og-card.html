<!doctype html>
<!--
  Source for public/og.png (1200x630 social share card).
  Rendered by opening this file at a 1200x630 viewport and screenshotting it;
  see scripts/build-og.mjs for the resample step.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #08090a;
      }

      /* Fixed artboard. The capture script scales it to fill the window so the
         screenshot can be downsampled to 1200x630 rather than upscaled. */
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        transform-origin: top left;
        overflow: hidden;
        background: #08090a;
        color: #ededf0;
        font-family: 'Inter', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* Same grid + accent glow the site's hero uses. */
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, #ffffff0f 1px, transparent 1px),
          linear-gradient(to bottom, #ffffff0f 1px, transparent 1px);
        background-size: 72px 72px;
        -webkit-mask-image: radial-gradient(
          ellipse 80% 75% at 25% 0%,
          #000 35%,
          transparent 100%
        );
      }

      .glow {
        position: absolute;
        top: -320px;
        left: -180px;
        width: 900px;
        height: 640px;
        border-radius: 9999px;
        background: radial-gradient(closest-side, #8b80f9, transparent);
        opacity: 0.5;
        filter: blur(90px);
      }

      .content {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 72px;
        max-width: 800px;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 14px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #6a6f78;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        background: #8b80f9;
      }

      h1 {
        margin-top: 26px;
        font-size: 84px;
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 1;
      }

      .role {
        margin-top: 22px;
        font-size: 31px;
        font-weight: 500;
        letter-spacing: -0.018em;
        color: #c3c6cc;
      }

      .focus {
        margin-top: 8px;
        font-size: 31px;
        font-weight: 500;
        letter-spacing: -0.018em;
        background: linear-gradient(90deg, #b0a8fb, #8b80f9);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .meta {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 44px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 16px;
        color: #8a8f98;
      }

      .meta span.sep {
        color: #2a2d33;
      }

      /* Portrait bleeds off the right edge and dissolves into the background. */
      .portrait {
        position: absolute;
        top: 0;
        right: 0;
        width: 470px;
        height: 630px;
        object-fit: cover;
        object-position: 50% 22%;
        -webkit-mask-image: linear-gradient(
          to right,
          transparent 0%,
          #000 42%,
          #000 100%
        );
      }

      .portrait-shade {
        position: absolute;
        top: 0;
        right: 0;
        width: 470px;
        height: 630px;
        background:
          linear-gradient(to right, #08090ae6 0%, #08090a33 45%, #08090a00 100%),
          linear-gradient(to bottom, #08090a66 0%, #08090a00 30%, #08090a99 100%);
      }

      .edge {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 5px;
        background: linear-gradient(90deg, #8b80f9, #8b80f9 32%, #1e2025 32%);
      }
    </style>
  </head>
  <body>
    <div class="card">
    <img class="portrait" src="../public/portrait.jpg" alt="" />
    <div class="portrait-shade"></div>
    <div class="grid"></div>
    <div class="glow"></div>

    <div class="content">
      <div class="eyebrow">
        <span class="dot"></span>
        San Jose, California
      </div>
      <h1>Jincheng Ma</h1>
      <div class="role">Backend Software Engineer</div>
      <div class="focus">AI Agents &amp; Distributed Systems</div>
      <div class="meta">
        <span>Go</span><span class="sep">/</span>
        <span>Python</span><span class="sep">/</span>
        <span>Multi-Agent Systems</span><span class="sep">/</span>
        <span>Distributed Backends</span>
      </div>
    </div>

    <div class="edge"></div>
    </div>

    <script>
      // Scale the artboard to the window width; scripts/build-og.mjs reads
      // window.__ogCapture to know what region of the screenshot to extract.
      const card = document.querySelector('.card');
      const scale = Math.min(window.innerWidth / 1200, window.innerHeight / 630);
      card.style.transform = `scale(${scale})`;
      window.__ogCapture = {
        scale,
        cssWidth: 1200 * scale,
        cssHeight: 630 * scale,
        viewportWidth: window.innerWidth,
        viewportHeight: window.innerHeight
      };
    </script>
  </body>
</html>
